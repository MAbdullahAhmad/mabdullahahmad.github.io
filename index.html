<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Abdullah A. | Coming Soon</title>
    <meta
      name="description"
      content="Personal website for Abdullah A. A new site is being prepared."
    >
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #0d0d0d;
        color: #f3f3f3;
      }

      main {
        width: min(720px, calc(100% - 2rem));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        align-content: center;
        gap: 1.5rem;
        padding: 4rem 0;
      }

      .eyebrow {
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #bcbcbc;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 6vw, 4.75rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        max-width: 42rem;
        font-size: 1.05rem;
        line-height: 1.75;
        color: #d0d0d0;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        padding-top: 0.5rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.8rem;
        padding: 0.75rem 1rem;
        border: 1px solid #3c3c3c;
        border-radius: 0.45rem;
        color: #f3f3f3;
        text-decoration: none;
        transition: background-color 160ms ease, border-color 160ms ease,
          color 160ms ease;
      }

      a.primary {
        background: #f3f3f3;
        border-color: #f3f3f3;
        color: #111111;
      }

      a:hover,
      a:focus-visible {
        background: #1a1a1a;
        border-color: #5c5c5c;
      }

      a.primary:hover,
      a.primary:focus-visible {
        background: #e7e7e7;
        border-color: #e7e7e7;
        color: #111111;
      }

      .note {
        font-size: 0.95rem;
        color: #9d9d9d;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Abdullah A.</p>
      <h1>Website coming soon.</h1>
      <p>
        A new personal site is being prepared. In the meantime, the main public
        work in progress is the LLM Tutorial project.
      </p>
      <div class="actions">
        <a class="primary" href="/LLM/">Open LLM Tutorial</a>
        <a href="https://github.com/MAbdullahAhmad">GitHub Profile</a>
      </div>
      <p class="note">
        If the tutorial link is not live yet, it is still being published.
      </p>
    </main>
  </body>
</html>
