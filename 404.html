<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found</title>
    <meta name="robots" content="noindex">
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #111111;
        color: #f3f3f3;
      }

      main {
        width: min(720px, calc(100% - 2rem));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        align-content: center;
        gap: 1rem;
        padding: 4rem 0;
      }

      .code {
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #b0b0b0;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.75rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        line-height: 1.75;
        color: #d0d0d0;
        max-width: 40rem;
      }

      a {
        display: inline-flex;
        width: fit-content;
        margin-top: 0.5rem;
        align-items: center;
        justify-content: center;
        min-height: 2.8rem;
        padding: 0.75rem 1rem;
        border: 1px solid #f3f3f3;
        border-radius: 0.45rem;
        background: #f3f3f3;
        color: #111111;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>That page is not available.</h1>
      <p id="message">
        The page you requested could not be found.
      </p>
      <a id="home-link" href="/">Back to home</a>
    </main>
    <script>
      if (location.pathname.startsWith("/llm")) {
        document.getElementById("message").textContent =
          "LLM Tutorial is still being published. Please check back shortly.";
        document.getElementById("home-link").textContent = "Open home page";
      }
    </script>
  </body>
</html>
