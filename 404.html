<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found</title>
    <meta name="robots" content="noindex">
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #111111;
        color: #f3f3f3;
      }

      main {
        width: min(720px, calc(100% - 2rem));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        align-content: center;
        gap: 1rem;
        padding: 4rem 0;
      }

      .code {
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #b0b0b0;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.75rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        line-height: 1.75;
        color: #d0d0d0;
        max-width: 40rem;
      }

      a {
        display: inline-flex;
        width: fit-content;
        margin-top: 0.5rem;
        align-items: center;
        justify-content: center;
        min-height: 2.8rem;
        padding: 0.75rem 1rem;
        border: 1px solid #f3f3f3;
        border-radius: 0.45rem;
        background: #f3f3f3;
        color: #111111;
        text-decoration: none;
      }

      .subtle {
        font-size: 0.95rem;
        color: #aaaaaa;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>That page is not available.</h1>
      <p id="message">
        The page you requested could not be found.
      </p>
      <p class="subtle" id="detail">
        If this path belongs to one of the public repositories, a redirect check
        will run automatically.
      </p>
      <a id="home-link" href="/">Back to home</a>
    </main>
    <script>
      (async function () {
        const owner = "MAbdullahAhmad";
        const path = location.pathname.replace(/^\/+|\/+$/g, "");
        const parts = path ? path.split("/") : [];
        const first = parts[0];
        const rest = parts.slice(1).join("/");
        const message = document.getElementById("message");
        const detail = document.getElementById("detail");
        const homeLink = document.getElementById("home-link");

        if (!first) {
          return;
        }

        if (first.toLowerCase() === "llm") {
          message.textContent = "Redirecting to the published LLM Tutorial path.";
          detail.textContent = "The repository is published as /LLM/ on GitHub Pages.";
          location.replace("/LLM/" + (rest ? rest + "/" : "") + location.search + location.hash);
          return;
        }

        const cacheKey = "repo-case:" + owner.toLowerCase() + ":" + first.toLowerCase();
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
          location.replace("/" + cached + "/" + (rest ? rest + "/" : "") + location.search + location.hash);
          return;
        }

        try {
          const response = await fetch("https://api.github.com/repos/" + owner + "/" + first, {
            headers: {
              Accept: "application/vnd.github+json"
            }
          });

          if (!response.ok) {
            if (first.toLowerCase() === "llm") {
              message.textContent = "LLM Tutorial is still being published. Please check back shortly.";
            }
            return;
          }

          const repo = await response.json();
          if (!repo || !repo.name) {
            return;
          }

          localStorage.setItem(cacheKey, repo.name);
          message.textContent = "Found a matching public repository. Redirecting now.";
          detail.textContent = "GitHub returned the canonical repository casing: " + repo.name;
          location.replace("/" + repo.name + "/" + (rest ? rest + "/" : "") + location.search + location.hash);
        } catch (error) {
          console.error("Repository redirect lookup failed", error);
          if (first.toLowerCase() === "llm") {
            message.textContent = "LLM Tutorial is still being published. Please check back shortly.";
          }
          homeLink.textContent = "Back to home";
        }
      })();

      if (location.pathname.startsWith("/LLM/")) {
        document.getElementById("message").textContent =
          "This tutorial path exists, but the exact page you requested could not be found.";
        document.getElementById("detail").textContent =
          "Try the tutorial home page or check the page path again.";
        document.getElementById("home-link").textContent = "Open tutorial home";
        document.getElementById("home-link").href = "/LLM/";
      }
    </script>
  </body>
</html>
